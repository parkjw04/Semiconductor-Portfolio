name: SEA Semiconductor News Update

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch semiconductor news
        run: node scripts/fetch-news.js

      - name: Analyze news with AI
        run: node scripts/analyze-news.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Save updated news and API usage
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update semiconductor news and API usage"
          file_pattern: data/news.json data/usage.json
